<!DOCTYPE html>
<html>
<head>
  <title>Password Checker</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: linear-gradient(135deg, #1a1a2e, #16213e, #0f3460);
      font-family: arial;
      text-align: center;
      min-height: 100vh;
      padding: 40px 20px;
      color: white;
    }

    h1 {
      font-size: 32px;
      color: #00d4ff;
      margin-bottom: 5px;
      text-shadow: 0 0 20px #00d4ff55;
    }

    .subtitle {
      color: #aaa;
      font-size: 14px;
      margin-bottom: 30px;
    }

    .card {
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 16px;
      padding: 30px;
      max-width: 520px;
      margin: 0 auto;
    }

    .input-wrapper {
      position: relative;
      display: inline-block;
      width: 100%;
    }

    input {
      width: 100%;
      height: 48px;
      font-size: 17px;
      padding: 0 50px 0 15px;
      border-radius: 10px;
      border: 2px solid #00d4ff55;
      background: rgba(255,255,255,0.08);
      color: white;
      outline: none;
      transition: border 0.3s;
    }

    input::placeholder {
      color: #666;
    }

    input:focus {
      border-color: #00d4ff;
    }

    .eye-btn {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      cursor: pointer;
      font-size: 20px;
      color: #aaa;
      padding: 0;
      margin: 0;
    }

    button.check-btn {
      margin-top: 15px;
      padding: 12px 30px;
      font-size: 16px;
      background: linear-gradient(90deg, #00d4ff, #0077ff);
      color: white;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      width: 100%;
      font-weight: bold;
      letter-spacing: 1px;
      transition: opacity 0.2s;
    }

    button.check-btn:hover {
      opacity: 0.85;
    }

    /* strength bar */
    .bar-container {
      margin-top: 22px;
      display: none;
    }

    .bar-label {
      font-size: 13px;
      color: #aaa;
      text-align: left;
      margin-bottom: 6px;
    }

    .bar-bg {
      background: rgba(255,255,255,0.1);
      border-radius: 20px;
      height: 12px;
      width: 100%;
      overflow: hidden;
    }

    .bar-fill {
      height: 100%;
      border-radius: 20px;
      width: 0%;
      transition: width 0.6s ease, background 0.4s;
    }

    /* result label */
    #result {
      margin-top: 18px;
      font-size: 22px;
      font-weight: bold;
      display: none;
    }

    .good  { color: #00e676; }
    .ok    { color: #ffab00; }
    .bad   { color: #ff5252; }

    /* info grid */
    .info-grid {
      display: none;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-top: 18px;
    }

    .info-box {
      background: rgba(255,255,255,0.07);
      border-radius: 10px;
      padding: 14px 10px;
      border: 1px solid rgba(255,255,255,0.08);
    }

    .info-box .label {
      font-size: 11px;
      color: #888;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 6px;
    }

    .info-box .value {
      font-size: 16px;
      font-weight: bold;
      color: #00d4ff;
    }

    /* checklist */
    .checklist {
      display: none;
      margin-top: 18px;
      text-align: left;
    }

    .checklist .check-title {
      font-size: 13px;
      color: #888;
      margin-bottom: 10px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .check-item {
      font-size: 14px;
      padding: 6px 0;
      border-bottom: 1px solid rgba(255,255,255,0.05);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .check-item:last-child { border-bottom: none; }

    /* tips */
    #tips {
      display: none;
      margin-top: 15px;
      background: rgba(255, 82, 82, 0.1);
      border: 1px solid rgba(255,82,82,0.2);
      border-radius: 10px;
      padding: 12px 15px;
      text-align: left;
      font-size: 13px;
      color: #ffaaaa;
      line-height: 1.9;
    }
  </style>
</head>
<body>

  <h1>🔐 Password Analyser</h1>
  <p class="subtitle">Check how strong your password really is</p>

  <div class="card">

    <div class="input-wrapper">
      <input type="password" id="myPassword" placeholder="enter your password...">
      <button class="eye-btn" onclick="toggleShow()" id="eyeBtn">👁️</button>
    </div>

    <button class="check-btn" onclick="checkPassword()">Analyse Password</button>

    <!-- strength bar -->
    <div class="bar-container" id="barContainer">
      <div class="bar-label">Strength</div>
      <div class="bar-bg">
        <div class="bar-fill" id="barFill"></div>
      </div>
    </div>

    <!-- score label -->
    <div id="result"></div>

    <!-- info grid: entropy, crack time, charset, score -->
    <div class="info-grid" id="infoGrid">
      <div class="info-box">
        <div class="label">🎲 Entropy</div>
        <div class="value" id="entropyVal">--</div>
      </div>
      <div class="info-box">
        <div class="label">⏱️ Crack Time</div>
        <div class="value" id="crackVal">--</div>
      </div>
      <div class="info-box">
        <div class="label">🔠 Charset Size</div>
        <div class="value" id="charsetVal">--</div>
      </div>
      <div class="info-box">
        <div class="label">⭐ Score</div>
        <div class="value" id="scoreVal">--</div>
      </div>
    </div>

    <!-- checklist -->
    <div class="checklist" id="checklist">
      <div class="check-title">Checks</div>
      <div class="check-item" id="chk-length">⬜ Length 8+</div>
      <div class="check-item" id="chk-upper">⬜ Uppercase letters</div>
      <div class="check-item" id="chk-lower">⬜ Lowercase letters</div>
      <div class="check-item" id="chk-number">⬜ Numbers</div>
      <div class="check-item" id="chk-special">⬜ Special characters</div>
      <div class="check-item" id="chk-long">⬜ Long (12+ chars)</div>
      <div class="check-item" id="chk-common">⬜ Not a common password</div>
    </div>

    <!-- tips -->
    <div id="tips"></div>

  </div>

  <script>

    function toggleShow() {
      var inp = document.getElementById("myPassword");
      var btn = document.getElementById("eyeBtn");
      if (inp.type == "password") {
        inp.type = "text";
        btn.textContent = "🙈";
      } else {
        inp.type = "password";
        btn.textContent = "👁️";
      }
    }

    function setCheck(id, passed) {
      var el = document.getElementById(id);
      var text = el.textContent.substring(2);  // strip old icon
      if (passed) {
        el.textContent = "✅ " + text;
        el.style.color = "#00e676";
      } else {
        el.textContent = "❌ " + text;
        el.style.color = "#ff5252";
      }
    }

    function calcEntropy(password) {
      // figure out charset size
      var hasLower   = /[a-z]/.test(password);
      var hasUpper   = /[A-Z]/.test(password);
      var hasNumber  = /[0-9]/.test(password);
      var hasSpecial = /[^a-zA-Z0-9]/.test(password);

      var charsetSize = 0;
      if (hasLower)   charsetSize += 26;
      if (hasUpper)   charsetSize += 26;
      if (hasNumber)  charsetSize += 10;
      if (hasSpecial) charsetSize += 32;

      if (charsetSize == 0) charsetSize = 26;  // fallback

      // entropy = length * log2(charsetSize)
      var entropy = password.length * (Math.log(charsetSize) / Math.log(2));
      return { entropy: Math.round(entropy), charsetSize: charsetSize };
    }

    function getCrackTime(entropy) {
      // assume attacker does 10 billion guesses per second (modern GPU)
      var guessesPerSecond = 10000000000;
      // combinations = 2^entropy, divide by 2 for average case
      var combinations = Math.pow(2, entropy) / 2;
      var seconds = combinations / guessesPerSecond;

      if (seconds < 1) return "instantly";
      if (seconds < 60) return Math.round(seconds) + " seconds";
      if (seconds < 3600) return Math.round(seconds / 60) + " minutes";
      if (seconds < 86400) return Math.round(seconds / 3600) + " hours";
      if (seconds < 2592000) return Math.round(seconds / 86400) + " days";
      if (seconds < 31536000) return Math.round(seconds / 2592000) + " months";
      if (seconds < 3153600000) return Math.round(seconds / 31536000) + " years";
      if (seconds < 315360000000) return Math.round(seconds / 3153600000) + " centuries";
      return "millions of years";
    }

    function checkPassword() {
      var password = document.getElementById("myPassword").value;

      if (password == "") {
        alert("please type a password first!!");
        return;
      }

      var points = 0;
      var tips = "";

      // ---- LENGTH CHECK (max 30 points) ----
      if (password.length < 6) {
        tips = tips + "❌ way too short! use at least 8 characters<br>";
      } else if (password.length < 8) {
        points = points + 8;
        tips = tips + "❌ a bit short, try 8 or more characters<br>";
      } else if (password.length < 12) {
        points = points + 18;
      } else if (password.length < 16) {
        points = points + 25;
      } else {
        points = points + 30;
      }

      // ---- NUMBER CHECK (max 15 points) ----
      var numberCount = 0;
      for (var i = 0; i < password.length; i++) {
        if (password[i] >= "0" && password[i] <= "9") numberCount++;
      }
      if (numberCount == 0) {
        tips = tips + "❌ add some numbers<br>";
      } else if (numberCount == 1) {
        points = points + 7;
      } else if (numberCount == 2) {
        points = points + 11;
      } else {
        points = points + 15;
      }

      // ---- UPPERCASE CHECK (max 15 points) ----
      var upperCount = 0;
      for (var i = 0; i < password.length; i++) {
        if (password[i] >= "A" && password[i] <= "Z") upperCount++;
      }
      if (upperCount == 0) {
        tips = tips + "❌ add CAPITAL letters<br>";
      } else if (upperCount == 1) {
        points = points + 7;
      } else {
        points = points + 15;
      }

      // ---- LOWERCASE CHECK (max 10 points) ----
      var lowerCount = 0;
      for (var i = 0; i < password.length; i++) {
        if (password[i] >= "a" && password[i] <= "z") lowerCount++;
      }
      if (lowerCount == 0) {
        tips = tips + "❌ add small letters<br>";
      } else if (lowerCount <= 2) {
        points = points + 5;
      } else {
        points = points + 10;
      }

      // ---- SPECIAL CHARS CHECK (max 20 points) ----
      var specials = "!@#$%^&*()_+-=[]{}|;:,.<>?";
      var specialCount = 0;
      for (var j = 0; j < password.length; j++) {
        if (specials.indexOf(password[j]) != -1) specialCount++;
      }
      if (specialCount == 0) {
        tips = tips + "❌ add special characters like ! @ # $<br>";
      } else if (specialCount == 1) {
        points = points + 10;
      } else {
        points = points + 20;
      }

      // ---- REPEAT PENALTY ----
      var repeatPenalty = 0;
      for (var i = 0; i < password.length; i++) {
        var count = 0;
        for (var k = 0; k < password.length; k++) {
          if (password[i] == password[k]) count++;
        }
        if (count >= 4) repeatPenalty = 15;
        else if (count >= 3 && repeatPenalty < 8) repeatPenalty = 8;
      }
      if (repeatPenalty > 0) {
        points = points - repeatPenalty;
        tips = tips + "⚠️ too many repeated characters<br>";
      }

      // ---- COMMON PASSWORDS ----
      var commonPasswords = ["password","123456","qwerty","abc123","password1","1234567","12345678","iloveyou","admin","letmein","welcome","monkey","dragon","sunshine","princess","football"];
      var lowerPass = password.toLowerCase();
      var isCommon = false;
      for (var m = 0; m < commonPasswords.length; m++) {
        if (lowerPass == commonPasswords[m]) {
          points = 0;
          tips = "❌ this is one of the most common passwords ever! change it!!<br>";
          isCommon = true;
          break;
        }
      }

      if (points < 0) points = 0;

      // score /5
      var score = points / 20;
      score = Math.round(score * 10) / 10;
      if (score > 5) score = 5;

      // entropy & crack time
      var entropyData = calcEntropy(password);
      var entropy = entropyData.entropy;
      var charsetSize = entropyData.charsetSize;
      var crackTime = getCrackTime(entropy);

      // ---- UPDATE UI ----

      // show all sections
      document.getElementById("barContainer").style.display = "block";
      document.getElementById("result").style.display = "block";
      document.getElementById("infoGrid").style.display = "grid";
      document.getElementById("checklist").style.display = "block";

      // bar
      var barFill = document.getElementById("barFill");
      var barPercent = (score / 5) * 100;
      barFill.style.width = barPercent + "%";

      // result label
      var resultDiv = document.getElementById("result");
      if (score < 2) {
        resultDiv.innerHTML = "😬 Weak Password";
        resultDiv.className = "bad";
        barFill.style.background = "linear-gradient(90deg, #ff5252, #ff1744)";
      } else if (score < 3.5) {
        resultDiv.innerHTML = "😐 Mediocre Password";
        resultDiv.className = "ok";
        barFill.style.background = "linear-gradient(90deg, #ffab00, #ff6d00)";
      } else if (score < 4.5) {
        resultDiv.innerHTML = "🙂 Good Password";
        resultDiv.className = "ok";
        barFill.style.background = "linear-gradient(90deg, #69f0ae, #00bfa5)";
      } else {
        resultDiv.innerHTML = "😎 Strong Password!";
        resultDiv.className = "good";
        barFill.style.background = "linear-gradient(90deg, #00e676, #1de9b6)";
        tips = "";
      }

      // info grid
      document.getElementById("entropyVal").textContent = entropy + " bits";
      document.getElementById("crackVal").textContent = crackTime;
      document.getElementById("charsetVal").textContent = charsetSize + " chars";
      document.getElementById("scoreVal").textContent = score + " / 5";

      // checklist
      setCheck("chk-length",  password.length >= 8);
      setCheck("chk-upper",   upperCount > 0);
      setCheck("chk-lower",   lowerCount > 0);
      setCheck("chk-number",  numberCount > 0);
      setCheck("chk-special", specialCount > 0);
      setCheck("chk-long",    password.length >= 12);
      setCheck("chk-common",  !isCommon);

      // tips
      var tipsDiv = document.getElementById("tips");
      if (tips != "") {
        tipsDiv.style.display = "block";
        tipsDiv.innerHTML = "<b>💡 Tips:</b><br>" + tips;
      } else {
        tipsDiv.style.display = "none";
        tipsDiv.innerHTML = "";
      }
    }

  </script>

</body>
</html>
